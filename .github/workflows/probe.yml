name: probe-smartthings
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: CORS SmartThings
        run: |
          for u in https://api.smartthings.com/v1/scenes https://api.smartthings.com/v1/oauth/token; do
            echo "== OPTIONS $u"
            curl -s -o /dev/null -D - -X OPTIONS "$u" -H "Origin: https://leftgrapher.github.io" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: authorization,content-type" | grep -iE "^HTTP|^access-control" || true
            echo "== GET $u (Origin null)"
            curl -s -o /dev/null -D - "$u" -H "Origin: null" -H "Authorization: Bearer x" | grep -iE "^HTTP|^access-control" || true
          done
