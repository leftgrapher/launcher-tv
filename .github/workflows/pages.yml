# Met le launcher en ligne (GitHub Pages) à chaque envoi sur « main », et rafraîchit les recos toutes les 6 heures.
# La TV récupère tout seule le nouveau code et les nouvelles recos.
name: Mise en ligne
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: node build.mjs
      # Mémoire entre deux passages (identifiants TMDB des films Letterboxd, dernières listes connues).
      - uses: actions/cache@v4
        with:
          path: .cache
          key: recos-${{ github.run_id }}
          restore-keys: recos-
      - name: ffmpeg (fonds 4K des recos)
        # Version prête à l’emploi publiée sur GitHub (BtbN, avec x265), apt en secours.
        # Sans ffmpeg, les recos sont faites quand même avec les fonds 4K déjà prêts : cette étape ne bloque jamais la mise à jour.
        timeout-minutes: 4
        continue-on-error: true
        run: |
          set -o pipefail
          if command -v ffmpeg >/dev/null && ffmpeg -hide_banner -encoders 2>/dev/null | grep -q libx265; then exit 0; fi
          d="$RUNNER_TEMP/ffmpeg"; mkdir -p "$d"
          if curl -fsSL --retry 3 --max-time 150 "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-linux64-gpl-8.1.tar.xz" | tar -xJ -C "$d" --strip-components=1; then
            echo "$d/bin" >> "$GITHUB_PATH"
            "$d/bin/ffmpeg" -hide_banner -version | head -1
          else
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends -o DPkg::Lock::Timeout=60 ffmpeg
          fi
      - name: Recos (Serializd, Letterboxd, Top 10 Netflix, TMDB, YouTube, jeux)
        run: node tools/recos.mjs dist/site/data/recos.json
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
          IGDB_CLIENT_ID: ${{ secrets.IGDB_CLIENT_ID }}
          IGDB_CLIENT_SECRET: ${{ secrets.IGDB_CLIENT_SECRET }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      # Une publication précédente restée « en cours » chez GitHub bloque la suivante : on l’annule d’abord.
      - name: Débloquer une publication restée en cours
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=6" -q '.[].sha' | sort -u | while read -r sha; do
            [ "$sha" = "${{ github.sha }}" ] && continue
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1 && echo "publication annulée : $sha" || true
          done
      - id: deployment
        uses: actions/deploy-pages@v4
